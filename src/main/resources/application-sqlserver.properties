spring.application.name=KHC-HIMS
server.port=8080

# ==============================================================================
# Microsoft SQL Server 2025 Express Configuration
# ==============================================================================

# Option 1: Named Instance for SQL Server Express (Default SQL Server Express setup)
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=KHC;encrypt=true;trustServerCertificate=true;

# Option 2: Default Port 1433 (If TCP/IP port 1433 is enabled in SQL Server Configuration Manager)
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=KHC;encrypt=true;trustServerCertificate=true;

# Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# SQL Server Authentication Credentials (sa or custom SQL user)
spring.datasource.username=sa
spring.datasource.password=Master@18

# Windows Authentication (Integrated Security) - uncomment if not using 'sa' SQL user:
# spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=KHC_HIMS;integratedSecurity=true;encrypt=true;trustServerCertificate=true;
# spring.datasource.username=
# spring.datasource.password=

# ==============================================================================
# JPA & Hibernate Settings for SQL Server
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
