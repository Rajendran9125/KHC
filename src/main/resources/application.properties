spring.application.name=KHC-HIMS
server.port=8080

# Active Profile: mysql (Loads application-mysql.properties)
# To switch to H2 in-memory: comment the line below or run with --spring.profiles.active=default
spring.profiles.active=postgres

# Default In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:khcdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# To use PostgreSQL: run with --spring.profiles.active=postgres
