spring.application.name=KHC-HIMS
server.port=8080

# ==============================================================================
# Active Database Profile:
# Options:
#   - mysql      -> Loads application-mysql.properties
#   - sqlserver  -> Loads application-sqlserver.properties (SQL Server 2025 Express)
#   - postgres   -> Loads application-postgres.properties
#   - default    -> In-memory H2 database
# ==============================================================================
spring.profiles.active=mysql

# Default In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:khcdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
